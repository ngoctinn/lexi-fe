<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Soil -->
  <ellipse cx="100" cy="200" rx="80" ry="30" fill="#8B6F47"/>
  <path d="M 30 200 Q 30 210 50 215 Q 70 220 100 220 Q 130 220 150 215 Q 170 210 170 200" fill="#6B5437"/>
  
  <!-- Seedling stem -->
  <line x1="100" y1="200" x2="100" y2="120" stroke="#8B6F47" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Two small leaves -->
  <ellipse cx="85" cy="140" rx="12" ry="20" fill="#4CAF50" transform="rotate(-30 85 140)"/>
  <ellipse cx="115" cy="140" rx="12" ry="20" fill="#66BB6A" transform="rotate(30 115 140)"/>
  
  <!-- Top leaf -->
  <ellipse cx="100" cy="110" rx="10" ry="18" fill="#81C784"/>
</svg>